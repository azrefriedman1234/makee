plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace "com.azreee.tglive"
    compileSdk 34

    defaultConfig {
        applicationId "com.azreee.pasiflonetmobile"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures { compose true }
    // Kotlin is pinned to 1.9.24 at the root. Keep a matching Compose compiler extension.
    composeOptions { kotlinCompilerExtensionVersion "1.5.15" }
    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.json:json:20240303"

    // FFmpegKit (includes FFprobeKit)
    // The "-LTS" suffix is required for Maven Central.
    // FFmpeg Kit (fork hosted on Maven Central; works on GitHub Actions)
    implementation "io.github.maitrungduc1410:ffmpeg-kit-https:6.0.1"

    // TDLib (from JitPack)
    implementation "com.github.tdlibx:td:1.8.56"
}
